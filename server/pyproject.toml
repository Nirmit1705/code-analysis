[project]
name = "server"
version = "0.1.0"
description = "AI Codebase Intelligence Platform backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false
